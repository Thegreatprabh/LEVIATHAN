[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan"
version = "1.0.0"
description = "LEVIATHAN — autonomous attack-path engine for authorized infrastructure. Scope-locked, evidence-based, canary-proof standard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
leviathan = "leviathan.cli:main"

[tool.setuptools.packages.find]
include = ["leviathan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
